# .goreleaser.yaml
version: 2
project_name: devex

builds:
  - id: devex
    main: ./cmd/devex
    binary: devex
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/project-init/devex/internal/version.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/project-init/devex/internal/version.commit={{ .ShortCommit }}

archives:
  - id: devex-archive
    name_template: "devex_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
