schema_version: v1

discovery:
  id: example-discovery
  title: Example discovery
  document: discovery.md

items:
  - id: INIT-001
    # Supported kinds: initiative, feature, task, defect, research.
    kind: initiative
    title: Deliver the discovery outcome
    description: Describe the outcome this initiative delivers.
    acceptance_criteria:
      - Describe a measurable outcome.
    depends_on: []
    labels: []

  - id: WI-001
    kind: research
    parent: INIT-001
    title: Validate the proposed approach
    description: Resolve the most important unknowns before implementation.
    acceptance_criteria:
      - The proposed approach is supported by evidence.
    depends_on: []
    labels: []
    estimate:
      value: 1
      # Supported units: points, hours, days, weeks.
      unit: weeks
